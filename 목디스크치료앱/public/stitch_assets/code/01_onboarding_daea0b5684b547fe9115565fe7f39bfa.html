<style>
        body {
            background-color: #f9f9ff;
            font-family: 'Inter', sans-serif;
            color: #091c35;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(235, 236, 240, 0.8);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .btn-press {
            transition: transform 0.1s ease;
        }
        .btn-press:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top Navigation Bar (Suppressed based on Onboarding rules, using as header brand placeholder) -->
<header class="w-full top-0 sticky bg-surface-bright shadow-sm z-50 flex justify-center items-center px-container-margin py-stack-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">clinical_notes</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">NeckCare</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap">
<!-- Hero Illustration Container -->
<div class="relative w-full max-w-md aspect-square mb-section-gap flex items-center justify-center">
<!-- Decorative atmospheric background -->
<div class="absolute inset-0 bg-primary-container/5 rounded-full blur-3xl"></div>
<!-- Main Medical Illustration -->
<div class="relative z-10 w-full h-full flex items-center justify-center animate-float">
<img class="w-full h-auto object-contain drop-shadow-xl" data-alt="A high-quality 3D medical illustration of a human cervical spine and upper back, showing healthy alignment and crystal clear vertebrae detail. The style is clean and clinical with a modern healthcare aesthetic, using soft blues, calming mint greens, and sterile white backgrounds. Soft, diffused lighting highlights the anatomical accuracy, creating a professional and trustworthy orthopedic medical atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAEYpDCxL93CQ9bw9ou36w2aeJDcYHAwYEe7gI56dMdGPIjHcklWnJbb--Q4PViVo0aMKULqxQ5fJmjUywRA2Z5S7AHO7A9Zc8ZO8M13c4M__A5pvZQ95ujvnc3dJtynIRpZIKwup0N1zGOv7gH0aQBzHrHsEvuzXwjmrDBSD5NrcwOPBl0WFofAxRghAabtrw1-0zCMJhfpfzpAqgxORbIazswZN8UXm0r4-ShAXK4P2sYzTLK5ScXPcdTySk4bb2wSJhsov-eg"/>
<!-- Floating Indicators -->
<div class="absolute top-1/4 right-4 glass-card rounded-xl p-3 flex items-center gap-2 shadow-lg animate-pulse" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-[#4CAF50]">check_circle</span>
<span class="font-label-sm text-label-sm text-secondary">Healthy Alignment</span>
</div>
<div class="absolute bottom-1/4 left-4 glass-card rounded-xl p-3 flex items-center gap-2 shadow-lg animate-pulse" style="animation-duration: 5s;">
<span class="material-symbols-outlined text-primary">analytics</span>
<span class="font-label-sm text-label-sm text-secondary">Posture Tracking</span>
</div>
</div>
</div>
<!-- Value Proposition Text -->
<div class="text-center w-full max-w-lg mb-section-gap space-y-stack-md">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight md:font-headline-lg md:text-headline-lg">
                바른 자세로 건강한 목과<br/>허리를 되찾으세요
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mx-auto">
                임상 전문가가 설계한 맞춤형 운동 프로그램으로 통증 없는 일상을 시작하세요.
            </p>
</div>
<!-- Action Button -->
<div class="w-full max-w-xs flex flex-col items-center gap-stack-lg">
<button class="btn-press w-full bg-primary hover:bg-primary-container text-on-primary py-stack-lg rounded-[12px] font-label-md text-label-md shadow-lg transition-all flex items-center justify-center gap-2" onclick="console.log('Navigate to setup')">
                시작하기
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="flex items-center gap-stack-sm text-outline">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Orthopedic Wellness System</span>
</div>
</div>
</main>
<!-- Footer Visual Element -->
<footer class="py-stack-lg w-full flex flex-col items-center gap-stack-sm opacity-60">
<div class="flex gap-stack-md">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
</footer>
<!-- Interactive Layer for cursor tracking atmosphere (Micro-interaction) -->
<div class="pointer-events-none fixed top-0 left-0 w-64 h-64 bg-primary/10 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-500 opacity-0" id="glow-cursor"></div>
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('glow-cursor');
            glow.style.opacity = '1';
            glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
        });
        
        document.addEventListener('mouseleave', () => {
            document.getElementById('glow-cursor').style.opacity = '0';
        });
    </script>
</body></html>
