<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        /* Custom skeleton overlay animation */
        @keyframes pulse-line {
            0%, 100% { opacity: 1; stroke-width: 3px; }
            50% { opacity: 0.6; stroke-width: 2px; }
        }
        .ai-joint {
            animation: pulse-line 2s infinite ease-in-out;
        }
        .ai-skeleton-line {
            stroke-dasharray: 8;
            animation: dash-move 20s linear infinite;
        }
        @keyframes dash-move {
            to { stroke-dashoffset: -1000; }
        }
        .camera-corner {
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f9f9ff",
                        "primary-fixed": "#dae2ff",
                        "on-primary-container": "#c4d2ff",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#ffca81",
                        "tertiary-fixed": "#ffddb3",
                        "outline-variant": "#c3c6d6",
                        "surface-dim": "#cadbfc",
                        "tertiary": "#5e3c00",
                        "primary-fixed-dim": "#b2c5ff",
                        "surface-container-high": "#dfe8ff",
                        "on-secondary-fixed": "#0a1f18",
                        "inverse-on-surface": "#ecf0ff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b2c5ff",
                        "surface-container-low": "#f0f3ff",
                        "on-tertiary-fixed-variant": "#624000",
                        "secondary-fixed-dim": "#b4ccc0",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#0052cc",
                        "secondary-container": "#cfe8dc",
                        "on-background": "#091c35",
                        "on-surface-variant": "#434654",
                        "on-surface": "#091c35",
                        "on-primary": "#ffffff",
                        "outline": "#737685",
                        "secondary": "#4d6359",
                        "on-secondary-fixed-variant": "#364b42",
                        "on-primary-fixed": "#001848",
                        "background": "#f9f9ff",
                        "surface-tint": "#0c56d0",
                        "inverse-surface": "#20314b",
                        "tertiary-fixed-dim": "#ffb950",
                        "surface-variant": "#d6e3ff",
                        "surface": "#f9f9ff",
                        "primary": "#003d9b",
                        "secondary-fixed": "#cfe8dc",
                        "tertiary-container": "#7d5200",
                        "on-error": "#ffffff",
                        "surface-container": "#e7eeff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#291800",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#0040a2",
                        "surface-container-highest": "#d6e3ff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#53695f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "section-gap": "40px",
                        "stack-lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-bright text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface-bright shadow-sm z-40 flex justify-between items-center px-container-margin py-stack-md w-full max-w-full">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">clinical_notes</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">NeckCare</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A professional close-up of a medical healthcare specialist in a clean, modern clinic setting. The lighting is soft and clinical, emphasizing reliability and professional care. The color palette consists of calming whites and deep professional blues." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDL3eCcGRdkB5Dle6uZzSQd_Ghq6zsBOeTSe1Nh-RGL2aF3SjZNN53GmvWt4NaLBijK5cmlctN82Pipkj3_0a_KTS6NlVGvFzQsnaoUDBKTwO8WOdnrmYp6XuSHimW9ZRKvjwG4xIwKssXkQjJc2XFbS9CreCZzDt2Nao8o5A5S9Nzi0n4y5CA-RdgfL51UTeaHJg_KVKKwMdQOtEKvWnjwiRXFv_Mfx0wmRU4UBO4zX66N50vwqJU5GsBtckFgeExttBAWEE9rOg"/>
</div>
</header>
<!-- Main Content: AI Posture Analysis Camera Interface -->
<main class="flex-1 relative flex flex-col items-center justify-center bg-black overflow-hidden">
<!-- Live Camera View Simulation -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-80" data-alt="A side-view photo of a person sitting at a desk with a neutral background. The lighting is bright and clear, capturing a realistic home office environment. The style is modern minimalist healthcare, with soft shadows and high-definition details for medical analysis." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDQcL0dREtyLfuXA5IO_aMdvgAclkw13qsX3Rowt1HA6jA6Uq09CnDeTuEqeOvd1OUU9YkP_vwH_4zLBPFczl_rxdhq-0e6Uln_FVAWeLYOJeSpqNSpF40K3lUwdbDWvYd6VrOD7Hz0b0LY7lq6yiMpWRAhFdrnNf5buCiOBKRGwDXOCR9PL0AjwLevTIYgn7XRZW8GviLzQ8035o0_KkVJSnR2yIZt9tvrmNieZV1fMOfx6cOcrSe-O9tcG8WYbtz1grrjMa0tw"/>
<!-- Camera Overlay UI -->
<div class="absolute inset-0 flex flex-col justify-between p-container-margin pointer-events-none">
<div class="flex justify-between items-start">
<div class="camera-corner border-l-4 border-t-4 w-12 h-12"></div>
<div class="camera-corner border-r-4 border-t-4 w-12 h-12"></div>
</div>
<div class="flex justify-between items-end">
<div class="camera-corner border-l-4 border-b-4 w-12 h-12"></div>
<div class="camera-corner border-r-4 border-b-4 w-12 h-12"></div>
</div>
</div>
</div>
<!-- AI Skeleton Overlay (SVG) -->
<svg class="absolute inset-0 w-full h-full z-10 pointer-events-none" viewbox="0 0 400 800">
<!-- Spine Alignment Path -->
<path class="ai-skeleton-line" d="M 200,200 L 200,300 L 220,450 L 210,650" fill="none" stroke="#ffb950" stroke-dasharray="8" stroke-width="4"></path>
<!-- Neck Angle Indicator -->
<path class="ai-joint" d="M 200,200 L 280,240" fill="none" stroke="#ba1a1a" stroke-width="6"></path>
<!-- Joints -->
<circle class="ai-joint" cx="200" cy="200" fill="#ffffff" r="8" stroke="#0c56d0" stroke-width="2"></circle> <!-- Head Base -->
<circle class="ai-joint" cx="200" cy="300" fill="#ffffff" r="8" stroke="#0c56d0" stroke-width="2"></circle> <!-- Shoulders -->
<circle class="ai-joint" cx="220" cy="450" fill="#ffffff" r="8" stroke="#0c56d0" stroke-width="2"></circle> <!-- Mid-back -->
<!-- Angle Text Overlay -->
<g transform="translate(250, 210)">
<rect fill="rgba(186, 26, 26, 0.9)" height="30" rx="8" width="80" x="0" y="0"></rect>
<text class="font-label-sm" fill="white" style="font-size: 14px;" text-anchor="middle" x="40" y="20">42° ALERT</text>
</g>
</svg>
<!-- Real-time Feedback Toast (Amber Alert) -->
<div class="absolute top-8 left-1/2 -translate-x-1/2 z-30 w-[calc(100%-48px)] max-w-md animate-bounce">
<div class="bg-tertiary-container border border-on-tertiary-container rounded-xl p-stack-md flex items-center gap-stack-sm shadow-lg backdrop-blur-sm">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-size: 24px;">warning</span>
<span class="font-label-md text-on-tertiary-container flex-1">목이 너무 앞으로 기울어져 있습니다!</span>
<span class="material-symbols-outlined text-on-tertiary-container opacity-60">close</span>
</div>
</div>
<!-- Data Stats Overlay -->
<div class="absolute right-gutter top-1/3 z-20 flex flex-col gap-unit">
<div class="bg-black/60 backdrop-blur-md rounded-lg p-stack-sm text-white flex flex-col items-center">
<span class="text-label-sm text-outline-variant">ANGLE</span>
<span class="text-headline-md font-bold text-error">42°</span>
</div>
<div class="bg-black/60 backdrop-blur-md rounded-lg p-stack-sm text-white flex flex-col items-center">
<span class="text-label-sm text-outline-variant">STRESS</span>
<span class="text-headline-md font-bold text-tertiary-fixed-dim">HIGH</span>
</div>
</div>
<!-- Bottom Controls Interface -->
<div class="absolute bottom-32 left-0 w-full z-30 px-container-margin">
<div class="flex justify-between items-center bg-surface-bright/90 backdrop-blur-lg rounded-2xl p-stack-lg shadow-xl border border-outline-variant/30">
<!-- Re-measure Button -->
<button class="flex flex-col items-center gap-unit text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full border-2 border-outline flex items-center justify-center">
<span class="material-symbols-outlined">restart_alt</span>
</div>
<span class="font-label-sm">다시 측정</span>
</button>
<!-- Capture Button -->
<button class="relative group">
<div class="absolute -inset-2 bg-primary/20 rounded-full blur-lg group-active:scale-110 transition-transform"></div>
<div class="w-20 h-20 bg-primary text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform relative z-10">
<span class="material-symbols-outlined" style="font-size: 40px;">camera</span>
</div>
</button>
<!-- Settings/Gallery Button -->
<button class="flex flex-col items-center gap-unit text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full border-2 border-outline flex items-center justify-center">
<span class="material-symbols-outlined">analytics</span>
</div>
<span class="font-label-sm">상세 분석</span>
</button>
</div>
</div>
<!-- Animated Ambient Effect -->

</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center px-gutter py-stack-sm pb-safe rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-stack-md py-unit hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">home_health</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<!-- ACTIVE TAB: Analysis -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-stack-md py-unit active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-sm text-label-sm">Analysis</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-stack-md py-unit hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-label-sm text-label-sm">Exercises</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-stack-md py-unit hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for camera capture
        const captureBtn = document.querySelector('button .material-symbols-outlined[data-icon="camera"]')?.closest('button');
        if(captureBtn) {
            captureBtn.addEventListener('click', () => {
                // Flash effect simulation
                const flash = document.createElement('div');
                flash.className = 'fixed inset-0 bg-white z-[100] transition-opacity duration-300 pointer-events-none';
                document.body.appendChild(flash);
                setTimeout(() => { flash.style.opacity = '0'; }, 50);
                setTimeout(() => { flash.remove(); }, 400);
            });
        }
    </script>
</body></html>
